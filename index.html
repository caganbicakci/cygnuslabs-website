<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CygnusLabs | Crafting Stellar Mobile Experiences</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#06b6d4", // Cyan-500
                        secondary: "#0891b2", // Cyan-600
                        "background-dark": "#0f172a", // Slate-900 (Deep Navy/Charcoal)
                        "surface-dark": "#1e293b", // Slate-800
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                    },
                },
            },
        };
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="bg-background-dark text-slate-100 selection:bg-primary selection:text-white">
    
    <!-- Component Containers -->
    <div id="header"></div>
    <div id="hero"></div>
    <div id="portfolio" style="display: none;"></div>
    <div id="footer"></div>
    
    <!-- Scripts -->
    <script src="scripts/component-loader.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
